# Builds docs/ with VitePress and publishes it to GitHub Pages.
#
# Enable once, by hand: Settings -> Pages -> Source -> "GitHub Actions". Without that
# the deploy job fails with "Get Pages site failed" and nothing here can fix it.
name: Deploy docs

on:
  push:
    branches: [main]
    # The site is self-contained in docs/, and this repository's churn is C++. No
    # reason to rebuild and redeploy it for a commit that cannot change a page.
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and queued rather than cancelled: a half-finished deploy
# that gets cancelled can leave the site on the previous build with no way to tell.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
        with:
          # lastUpdated: true in config.mts reads each page's git history. The default
          # shallow clone has none, so every page would claim the same timestamp.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      # ci, not install: docs/package-lock.json is committed, and a lockfile that the
      # build is allowed to rewrite is not a lockfile.
      - run: npm ci

      - uses: actions/configure-pages@v5

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
